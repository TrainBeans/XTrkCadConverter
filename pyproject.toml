[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xtrkcad-converter"
version = "0.1.0"
description = "Convert DWG/DXF CAD files to XTrkCad .xtc format for use as background drawings"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "ezdxf>=1.0",
]

[project.scripts]
xtrkcad-converter = "xtrkcad_converter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
